AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Brass Tacks — a team of agents that grows a small business overnight and is
  then held to account for it.

  Four Lambda entry points share one image. run_night() still sequences Radar →
  Analyst → Maker → Meter inside one tested function; the other three are the
  request-driven Ask, Decision, and read-only Workflow surfaces.

  Deploy from the repository root:
    sam build --template deploy/template.yaml
    sam deploy --guided

Parameters:
  SsmPrefix:
    Type: String
    Default: /brasstacks
    Description: >
      SSM Parameter Store path holding COCKROACH_DATABASE_URL,
      ANTHROPIC_API_KEY, COCKROACH_MCP_TOKEN, BRASSTACKS_BUSINESS_ID, and
      optionally BRASSTACKS_OPERATOR_BUSINESS_IDS. Secrets live here rather
      than in Lambda environment variables, where they would be readable from
      the console.

  ArtifactBucket:
    Type: String
    Description: S3 bucket for the Maker's drafts.

  ScheduleExpression:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: >
      The 6 AM Radar. This is what makes the loop autonomous rather than a
      button, which is the claim the whole product rests on.

  ScheduleTimezone:
    Type: String
    Default: America/New_York
    Description: The owner's timezone — 6 AM should mean her morning.

  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Whether the nightly run actually fires. Defaults to DISABLED because the
      schedule spends money on embeddings and reasoning every night, and a
      deploy that silently switched it on would be discovered at 6 AM. Turning
      the autopilot on is a deliberate act: deploy with
      ScheduleState=ENABLED, or flip it in the console.

Globals:
  Function:
    MemorySize: 1024
    Environment:
      Variables:
        BRASSTACKS_SSM_PREFIX: !Ref SsmPrefix
        # AWS_REGION is set by the Lambda runtime itself and is reserved, so
        # config.py's required("AWS_REGION") is already satisfied here.
        S3_ARTIFACT_BUCKET: !Ref ArtifactBucket
        BEDROCK_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
        EMBEDDING_DIMENSIONS: "1024"
        # Reasoning runs on the Anthropic API, not Bedrock: AWS cannot grant
        # this account any current Claude model. Disclosed in the README.
        MODEL_PROVIDER: anthropic
        ANTHROPIC_MODEL_ID: claude-opus-5

Resources:
  # --------------------------------------------------------------------
  # The nightly loop
  # --------------------------------------------------------------------
  NightFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: night
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.night.handler"]
      # A night is single-digit minutes; the headroom is for a cold corpus,
      # where Radar embeds every observation rather than a night's delta.
      Timeout: 900
      Policies:
        - Statement:
            - Sid: TitanEmbeddings
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: MakerArtifacts
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${ArtifactBucket}/*
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                # Both forms are required. GetParametersByPath authorises
                # against the path resource itself, while GetParameter
                # authorises against each parameter beneath it. Granting only
                # the `/*` form denies the path call — which is what happened
                # on the first deploy.
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            # Declared, so CloudFormation owns it. Without this property the
            # stack has no opinion about the schedule's state, and a deploy
            # silently reverts anyone who disabled it out of band.
            State: !Ref ScheduleState
            # One night is worth more than a retried night: a duplicate run
            # would re-embed and re-reason for no new information.
            RetryPolicy:
              MaximumRetryAttempts: 2

  # --------------------------------------------------------------------
  # Owner Q&A over the CockroachDB managed MCP server
  # --------------------------------------------------------------------
  AskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: ask
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.ask.handler"]
      # The MCP tool calls execute server-side between Anthropic and
      # CockroachDB Cloud, so a turn can run several queries before answering.
      Timeout: 120
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                # Both forms are required. GetParametersByPath authorises
                # against the path resource itself, while GetParameter
                # authorises against each parameter beneath it. Granting only
                # the `/*` form denies the path call — which is what happened
                # on the first deploy.
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /ask
            Method: POST

  # --------------------------------------------------------------------
  # Owner decisions from the For You feed
  # --------------------------------------------------------------------
  DecisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: decision
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.decision.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Decide:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /finds/{find_id}/decision
            Method: POST

  # --------------------------------------------------------------------
  # Live, read-only owner workflow state for Memory Engine
  # --------------------------------------------------------------------
  WorkflowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: workflow
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.workflow.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Workflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /workflow
            Method: GET

  # --------------------------------------------------------------------
  # Login — unauthenticated by definition, and the way into every tenant
  # --------------------------------------------------------------------
  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: login
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.login.handler"]
      # scrypt at n=16384 is deliberately slow — that is the point — and a cold
      # start pays for the SSM read on top. Ten seconds is generous for one
      # hash; a login that takes longer than this has a different problem.
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        LogIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /login
            Method: POST

  LogoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: logout
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.login.logout_handler"]
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        LogOut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /logout
            Method: POST

  # --------------------------------------------------------------------
  # Signup step one: the account. Gated by the invite code, because this is
  # the endpoint a stranger can reach.
  # --------------------------------------------------------------------
  RegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: register
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.register.handler"]
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /register
            Method: POST

  # --------------------------------------------------------------------
  # Signup step two: the business profile, for an account that already exists
  # --------------------------------------------------------------------
  OnboardingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: onboarding
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.onboarding.handler"]
      # Geocoding plus one embedding call per profile fact.
      Timeout: 60
      Policies:
        - Statement:
            # Signup embeds the profile so the Analyst can retrieve it later.
            - Sid: TitanEmbeddings
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Onboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /onboarding
            Method: POST

  # --------------------------------------------------------------------
  # "Show me my first night" — the button at the end of onboarding
  # --------------------------------------------------------------------
  RunFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: run
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.run.handler"]
      # It authorises and fires; it never waits for the night. API Gateway caps
      # an integration at 30s and a night runs 60-90, so a synchronous trigger
      # would 504 while the work carried on invisibly.
      Timeout: 15
      Environment:
        Variables:
          BRASSTACKS_NIGHT_FUNCTION: !Ref NightFunction
      Policies:
        - Statement:
            - Sid: StartOneNight
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt NightFunction.Arn
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Run:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /run
            Method: POST

  # --------------------------------------------------------------------
  # The operator view. The one read that crosses tenant boundaries.
  # --------------------------------------------------------------------
  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: admin
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.admin.handler"]
      # Reads every active tenant in one set of queries, so it is given more
      # room than the single-tenant workflow endpoint.
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Workspaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /admin/workspaces
            Method: GET

  AskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      # A public URL proxying a paid model is a bill waiting to happen. This is
      # deliberately low: it is a demo endpoint, not a product surface.
      # (HttpApi uses DefaultRouteSettings; `Throttle` is the REST-API-only
      # property on AWS::Serverless::Api and is silently wrong here.)
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: ["*"]
        # Authorization carries the session token. Without it here the browser
        # drops the header on the preflight and every authenticated call fails
        # in the page while working perfectly in curl.
        AllowHeaders: ["Content-Type", "If-None-Match", "Authorization"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        ExposeHeaders: ["ETag"]

  # --------------------------------------------------------------------
  # The board, hosted
  # --------------------------------------------------------------------
  # A separate bucket from ArtifactBucket, deliberately. That one holds the
  # Maker's owner deliverables; this one is served to the public internet. One
  # bucket for both would be one policy mistake away from publishing her drafts.
  #
  # Unnamed on purpose: S3 bucket names are globally unique, and a hardcoded one
  # makes the template fail for anyone who redeploys it — a judge included.
  # CloudFormation generates a name; SiteBucketName outputs it for the sync.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # The bucket stays private and CloudFront is the only reader. The alternative
  # — an S3 website endpoint — would mean a publicly readable bucket and HTTP
  # only, and the board makes HTTPS calls to the API.
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            # Without this condition any CloudFront distribution in any account
            # could read the bucket.
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # DefaultRootObject only resolves "/" — it does nothing for "/app/" or
  # "/signup/", which are the two pages that matter. With a REST origin S3 has
  # no concept of an index document, so those paths return 403 and the board
  # looks broken while the landing page works. This rewrites them before the
  # request reaches the origin.
  SiteRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-append-index
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory paths to their index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} board
        DefaultRootObject: index.html
        HttpVersion: http2
        # US/Europe only. This is a demo URL, not a global product, and the
        # cheapest class is a third of the price of full coverage.
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteS3Origin
            # RegionalDomainName, not WebsiteURL: the website endpoint would
            # require a public bucket and speaks HTTP only.
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed-CachingOptimized. A fixed AWS-owned id, stable across
          # accounts and regions.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRewriteFunction.FunctionMetadata.FunctionARN

Outputs:
  SiteUrl:
    Description: The board. Landing at /, dashboard at /app/, onboarding at /signup/.
    Value: !Sub https://${SiteDistribution.DomainName}

  SiteBucketName:
    Description: >
      Publish into this after a build:
      aws s3 sync web/ s3://<this>/ --delete
    Value: !Ref SiteBucket

  AskEndpoint:
    # Quoted: the JSON braces contain a colon, which bare YAML reads as a
    # key/value split and rejects.
    Description: 'POST a JSON body {"question": "..."} here. Splice into the built site.'
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/ask

  DecisionEndpoint:
    Description: Base URL used by the static app for Do it / Pass writes.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1

  WorkflowEndpoint:
    Description: GET live owner workflow state for the Memory Engine overlay.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/workflow

  AdminWorkspacesEndpoint:
    Description: >
      Every active tenant, for an operator. Requires a session whose account
      has is_admin; an ordinary owner's valid session gets a 403.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/admin/workspaces

  RunEndpoint:
    Description: >
      POST with a session token to start that owner's first night. Returns 202
      immediately — the night runs asynchronously and the board polls /workflow.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/run

  RegisterEndpoint:
    Description: >
      Signup step one. POST {"username","password","inviteCode"}; returns a
      session token the onboarding endpoint then requires.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/register

  LoginEndpoint:
    Description: >
      POST {"username": "...", "password": "..."} here. Returns a session token
      to send as `Authorization: Bearer`. POST /logout ends it.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/login

  OnboardingEndpoint:
    Description: >
      Signup. Requires the invite code held at
      /brasstacks/BRASSTACKS_INVITE_CODE — without it every request is a 403.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/onboarding

  NightFunctionName:
    Description: Invoke manually to prove a night end to end before waiting for 6 AM.
    Value: !Ref NightFunction
