name: Deploy Frontend

on:
  # Dispatch only. Deploys run from a developer machine now — `python
  # scripts/deploy.py` publishes the board in about fifteen seconds, against
  # five minutes of runner time for the same result.
  #
  # The push trigger is gone rather than merely unused: it fired on every merge
  # touching site/**, which meant a deploy nobody asked for, racing whatever was
  # published locally. Kept as workflow_dispatch so there is still a way in when
  # nobody has a laptop.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brasstacks-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Read existing stack outputs
        id: outputs
        shell: bash
        run: |
          value() {
            aws cloudformation describe-stacks \
              --stack-name brasstacks \
              --region us-east-1 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          SITE_BUCKET=$(value SiteBucketName)
          SITE_URL=$(value SiteUrl)
          DECISION_ENDPOINT=$(value DecisionEndpoint)
          WORKFLOW_ENDPOINT=$(value WorkflowEndpoint)
          LOGIN_ENDPOINT=$(value LoginEndpoint)
          REGISTER_ENDPOINT=$(value RegisterEndpoint)
          ONBOARDING_ENDPOINT=$(value OnboardingEndpoint)
          RUN_ENDPOINT=$(value RunEndpoint)
          ADMIN_ENDPOINT=$(value AdminWorkspacesEndpoint)
          GOOGLE_START_ENDPOINT=$(value GoogleStartEndpoint)
          GOOGLE_COMPLETE_ENDPOINT=$(value GoogleCompleteEndpoint)

          # Draw the Sign in with Google button only once an OAuth client
          # actually exists. The routes are always deployed; without the client
          # they answer 404, and a button that 404s is worse than no button.
          if aws ssm get-parameter \
               --name "/brasstacks/GOOGLE_OAUTH_CLIENT_ID" \
               --region us-east-1 >/dev/null 2>&1; then
            GOOGLE_OAUTH_ENABLED=1
          else
            GOOGLE_OAUTH_ENABLED=
          fi

          # Match the distribution by its CloudFront domain OR any alias, so a
          # custom-domain SiteUrl still resolves. `|| []` guards distributions
          # with no aliases, where Aliases.Items is null and contains() errors.
          HOST="${SITE_URL#https://}"
          HOST="${HOST%%/*}"
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${HOST}' || contains(Aliases.Items || \`[]\`, '${HOST}')].Id | [0]" \
            --output text)

          echo "site_bucket=$SITE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "decision_endpoint=$DECISION_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "workflow_endpoint=$WORKFLOW_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "login_endpoint=$LOGIN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "register_endpoint=$REGISTER_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "onboarding_endpoint=$ONBOARDING_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "run_endpoint=$RUN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "admin_endpoint=$ADMIN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "google_start_endpoint=$GOOGLE_START_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "google_complete_endpoint=$GOOGLE_COMPLETE_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "google_oauth_enabled=$GOOGLE_OAUTH_ENABLED" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      # Says WHICH value is missing and prints what actually exists, so a
      # failure here is diagnosable from the log alone. The anonymous version
      # of this step said only "a required stack output was not found".
      - name: Validate deployment values
        shell: bash
        run: |
          fail=0
          check() {
            if [ -z "$2" ] || [ "$2" = "None" ]; then
              echo "::error::$1 was not found."
              fail=1
            else
              echo "$1 = $2"
            fi
          }
          check "SiteBucketName (stack output)" "${{ steps.outputs.outputs.site_bucket }}"
          check "SiteUrl (stack output)" "${{ steps.outputs.outputs.site_url }}"
          check "CloudFront distribution for SiteUrl" "${{ steps.outputs.outputs.distribution_id }}"

          if [ "$fail" = "1" ]; then
            echo ""
            echo "Outputs present on stack 'brasstacks' in us-east-1:"
            aws cloudformation describe-stacks \
              --stack-name brasstacks --region us-east-1 \
              --query "Stacks[0].Outputs[].OutputKey" --output text || true
            echo ""
            echo "CloudFront distributions on this account:"
            aws cloudfront list-distributions \
              --query "DistributionList.Items[].{Id:Id,Domain:DomainName,Aliases:Aliases.Items}" \
              --output table || true
            exit 1
          fi

      - name: Build connected frontend
        env:
          DECISION_API_ENDPOINT: ${{ steps.outputs.outputs.decision_endpoint }}
          WORKFLOW_API_ENDPOINT: ${{ steps.outputs.outputs.workflow_endpoint }}
          LOGIN_API_ENDPOINT: ${{ steps.outputs.outputs.login_endpoint }}
          REGISTER_API_ENDPOINT: ${{ steps.outputs.outputs.register_endpoint }}
          ONBOARDING_API_ENDPOINT: ${{ steps.outputs.outputs.onboarding_endpoint }}
          RUN_API_ENDPOINT: ${{ steps.outputs.outputs.run_endpoint }}
          ADMIN_API_ENDPOINT: ${{ steps.outputs.outputs.admin_endpoint }}
          GOOGLE_START_API_ENDPOINT: ${{ steps.outputs.outputs.google_start_endpoint }}
          GOOGLE_COMPLETE_API_ENDPOINT: ${{ steps.outputs.outputs.google_complete_endpoint }}
          GOOGLE_OAUTH_ENABLED: ${{ steps.outputs.outputs.google_oauth_enabled }}
        run: python scripts/build_web.py

      - name: Upload frontend to S3
        run: |
          aws s3 sync web/ \
            "s3://${{ steps.outputs.outputs.site_bucket }}/" \
            --delete \
            --cache-control "no-cache"

      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Frontend deployed."
          echo "Site: ${{ steps.outputs.outputs.site_url }}"