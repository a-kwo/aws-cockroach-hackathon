[project]
name = "brasstacks"
version = "0.1.0"
description = "Agents that find money for small businesses, and prove whether it paid."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    # Claude on Bedrock goes through the Anthropic SDK's Mantle client, not
    # boto3 invoke_model. boto3 is still needed for Titan embeddings (an AWS
    # model) and for S3.
    "anthropic[bedrock]>=0.40",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# pytest config deliberately lives in the repo-root pytest.ini, not here, so
# that `pytest` works from either the root or this directory. See pytest.ini.
