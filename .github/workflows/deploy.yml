name: Deploy Brass Tacks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brasstacks-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: AKIA42QD7G5IVELIB4FM
          aws-secret-access-key: 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
          aws-region: us-east-1

      - name: Confirm AWS account
        run: aws sts get-caller-identity

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Run backend tests
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          python -m pytest backend/tests -q

      - name: Build Lambda container images
        run: sam build --template deploy/template.yaml

      - name: Deploy existing stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name brasstacks \
            --region us-east-1 \
            --capabilities CAPABILITY_IAM \
            --resolve-image-repos \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ArtifactBucket="${{ secrets.ARTIFACT_BUCKET }}"

      - name: Read deployed stack outputs
        id: outputs
        shell: bash
        run: |
          STACK=brasstacks
          REGION=us-east-1

          value() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          echo "decision_endpoint=$(value DecisionEndpoint)" >> "$GITHUB_OUTPUT"
          echo "workflow_endpoint=$(value WorkflowEndpoint)" >> "$GITHUB_OUTPUT"
          echo "site_bucket=$(value SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(value SiteUrl)" >> "$GITHUB_OUTPUT"

      - name: Build connected frontend
        env:
          DECISION_API_ENDPOINT: ${{ steps.outputs.outputs.decision_endpoint }}
          WORKFLOW_API_ENDPOINT: ${{ steps.outputs.outputs.workflow_endpoint }}
        run: python scripts/build_web.py

      - name: Publish frontend to S3
        run: |
          aws s3 sync web/ \
            "s3://${{ steps.outputs.outputs.site_bucket }}/" \
            --delete

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "Site: ${{ steps.outputs.outputs.site_url }}"
          echo "Workflow: ${{ steps.outputs.outputs.workflow_endpoint }}"