AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Brass Tacks — a team of agents that grows a small business overnight and is
  then held to account for it.

  The scheduled night handles Radar, Analyst and Meter. A dedicated Maker
  worker starts immediately after Do it or Undo Pass and reconciles accepted
  backlog independently. The remaining request-driven functions serve Ask,
  decisions, authentication, onboarding and live workflow state.

  Deploy from the repository root:
    sam build --template deploy/template.yaml
    sam deploy --guided

Parameters:
  SsmPrefix:
    Type: String
    Default: /brasstacks
    Description: >
      SSM Parameter Store path holding COCKROACH_DATABASE_URL,
      ANTHROPIC_API_KEY, COCKROACH_MCP_TOKEN, BRASSTACKS_BUSINESS_ID, optional
      BRASSTACKS_OPERATOR_BUSINESS_IDS, and optional Maker email settings.
      Secrets live here rather than in committed files or model prompts.

  ArtifactBucket:
    Type: String
    Description: S3 bucket for the Maker's drafts.

  ScheduleExpression:
    Type: String
    Default: cron(0 18 * * ? *)
    Description: >
      6 PM local — dinner service, not dawn. This was cron(0 6 * * ? *) until
      2026-08-03, and the consequence is in the data: the only three sweeps
      that ever ran fired at 06:28, 08:07 and 08:40 local, so every observation
      in the corpus was captured while its tenant was closed. Radar read shut
      storefronts, "not available right now" reached the Analyst as an outage,
      and a find was published on it. 18:00 is inside trading hours for a
      restaurant, a shop and a salon alike, and the owner still wakes up to
      finished work — the run costs single-digit minutes and everything after
      it is asleep. Not later than 18:00: a 900-second night starting at 18:00
      EST ends at 23:15 UTC, and pushing it past the UTC midnight boundary
      would date tonight's observations tomorrow.

  ScheduleTimezone:
    Type: String
    Default: America/New_York
    Description: >
      The owner's timezone. The hour above is chosen against local trading
      hours, so it is meaningless without this.

  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Whether the nightly run actually fires. Defaults to DISABLED because the
      schedule spends money on embeddings and reasoning every night, and a
      deploy that silently switched it on would be discovered the next morning.
      Turning the autopilot on is a deliberate act: deploy with
      ScheduleState=ENABLED, or flip it in the console.

  MakerSweepExpression:
    Type: String
    Default: rate(5 minutes)
    Description: >
      Reconciliation cadence for accepted recommendations that still have no
      Maker artifact. Owner decisions invoke Maker immediately; this SQL-first
      sweep recovers a missed event and drains pre-existing backlog.

  MakerSweepState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Keep the Maker reconciliation safety net active. An empty sweep performs
      only CockroachDB reads and consumes zero reasoning-model tokens.

Globals:
  Function:
    MemorySize: 1024
    Environment:
      Variables:
        BRASSTACKS_SSM_PREFIX: !Ref SsmPrefix
        # AWS_REGION is set by the Lambda runtime itself and is reserved, so
        # config.py's required("AWS_REGION") is already satisfied here.
        S3_ARTIFACT_BUCKET: !Ref ArtifactBucket
        BEDROCK_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
        EMBEDDING_DIMENSIONS: "1024"
        # Reasoning runs on the Anthropic API, not Bedrock: AWS cannot grant
        # this account any current Claude model. Disclosed in the README.
        MODEL_PROVIDER: anthropic
        ANTHROPIC_MODEL_ID: claude-opus-5

Resources:
  # --------------------------------------------------------------------
  # The nightly loop
  # --------------------------------------------------------------------
  NightFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: night
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.night.handler"]
      # A night is single-digit minutes; the headroom is for a cold corpus,
      # where Radar embeds every observation rather than a night's delta.
      Timeout: 900
      Policies:
        - Statement:
            - Sid: TitanEmbeddings
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                # Both forms are required. GetParametersByPath authorises
                # against the path resource itself, while GetParameter
                # authorises against each parameter beneath it. Granting only
                # the `/*` form denies the path call — which is what happened
                # on the first deploy.
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            # Declared, so CloudFormation owns it. Without this property the
            # stack has no opinion about the schedule's state, and a deploy
            # silently reverts anyone who disabled it out of band.
            State: !Ref ScheduleState
            # One night is worth more than a retried night: a duplicate run
            # would re-embed and re-reason for no new information.
            RetryPolicy:
              MaximumRetryAttempts: 2

  # --------------------------------------------------------------------
  # Durable multi-tenant Maker control plane
  # --------------------------------------------------------------------
  MakerTaskDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  MakerTaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MakerTaskDeadLetterQueue.Arn
        maxReceiveCount: 5

  # SQS absorbs bursts from many owners. Each recommendation uses its own FIFO
  # message group, so retries stay ordered while unrelated tasks run in parallel.
  TaskStarterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: task-starter
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.task_starter.handler"]
      Timeout: 30
      Environment:
        Variables:
          BRASSTACKS_MAKER_STATE_MACHINE_ARN: !Ref MakerWorkflow
      Policies:
        - Statement:
            - Sid: StartMakerWorkflow
              Effect: Allow
              Action: states:StartExecution
              Resource: !Ref MakerWorkflow
            - Sid: ConsumeMakerQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt MakerTaskQueue.Arn
      Events:
        MakerTasks:
          Type: SQS
          Properties:
            Queue: !GetAtt MakerTaskQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # One worker processes one task id. CockroachDB's atomic claim happens before
  # the reasoner is constructed, so duplicate deliveries spend zero model tokens.
  MakerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: maker
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.maker.handler"]
      Timeout: 600
      Policies:
        - Statement:
            - Sid: MakerArtifacts
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${ArtifactBucket}/*
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  # Amazon SES emits durable delivery telemetry for every Maker review email.
  # The tool receipt records the exact message submitted; this configuration set
  # adds delivery, open, click, bounce and complaint events asynchronously.
  MakerEmailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub ${AWS::StackName}-maker-review

  MakerEmailEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref MakerEmailConfigurationSet
      EventDestination:
        Name: eventbridge
        Enabled: true
        MatchingEventTypes:
          - SEND
          - REJECT
          - BOUNCE
          - COMPLAINT
          - DELIVERY
          - OPEN
          - CLICK
          - RENDERING_FAILURE
          - DELIVERY_DELAY
          - SUBSCRIPTION
        EventBridgeDestination:
          EventBusArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  # The first constrained execution tool. It can only send the completed draft
  # to the configured owner/test inbox; the model never chooses an address.
  MakerEmailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: maker-email
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.maker_email.handler"]
      Timeout: 30
      Environment:
        Variables:
          BRASSTACKS_SITE_URL: !Sub https://${SiteDistribution.DomainName}
          MAKER_EMAIL_CONFIGURATION_SET: !Ref MakerEmailConfigurationSet
      Policies:
        - Statement:
            - Sid: SendOwnerReviewEmail
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  # SES publishes provider-side delivery events to EventBridge. This worker
  # correlates them to the original tool execution by the signed SES message id
  # and custom tags, then appends immutable receipts in CockroachDB.
  MakerEmailEventFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: maker-email-event
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.ses_event.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        SesReviewEmailEvents:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.ses
              detail-type:
                - Email Sent
                - Email Delivered
                - Email Opened
                - Email Clicked
                - Email Bounced
                - Email Complaint Received
                - Email Delivery Delayed
                - Email Rejected
                - Email Rendering Failed
                - Email Subscribed

  MakerWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: maker_workflow.asl.json
      DefinitionSubstitutions:
        MakerFunctionArn: !GetAtt MakerFunction.Arn
        MakerEmailFunctionArn: !GetAtt MakerEmailFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MakerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MakerEmailFunction

  # SQL-only safety net: create tasks for legacy approved finds, recover expired
  # leases, and requeue retryable work. An empty pass consumes zero LLM tokens.
  MakerReconcilerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: maker-reconciler
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.task_reconciler.handler"]
      Timeout: 120
      Environment:
        Variables:
          BRASSTACKS_MAKER_QUEUE_URL: !Ref MakerTaskQueue
      Policies:
        - Statement:
            - Sid: DispatchMakerTasks
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt MakerTaskQueue.Arn
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        ReconcileAcceptedWork:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref MakerSweepExpression
            State: !Ref MakerSweepState
            RetryPolicy:
              MaximumRetryAttempts: 2

  # --------------------------------------------------------------------
  # Owner Q&A over the CockroachDB managed MCP server
  # --------------------------------------------------------------------
  AskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: ask
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.ask.handler"]
      Environment:
        Variables:
          BRASSTACKS_MAKER_QUEUE_URL: !Ref MakerTaskQueue
      # The MCP tool calls execute server-side between Anthropic and
      # CockroachDB Cloud, so a turn can run several queries before answering.
      Timeout: 120
      Policies:
        - Statement:
            - Sid: ConversationMemoryEmbedding
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                # Both forms are required. GetParametersByPath authorises
                # against the path resource itself, while GetParameter
                # authorises against each parameter beneath it. Granting only
                # the `/*` form denies the path call — which is what happened
                # on the first deploy.
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
            - Sid: QueueMakerTask
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt MakerTaskQueue.Arn
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /ask
            Method: POST
        AskHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /ask
            Method: GET

  # --------------------------------------------------------------------
  # Owner decisions from the For You feed
  # --------------------------------------------------------------------
  DecisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: decision
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.decision.handler"]
      Environment:
        Variables:
          BRASSTACKS_MAKER_QUEUE_URL: !Ref MakerTaskQueue
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
            - Sid: QueueMakerTask
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt MakerTaskQueue.Arn
      Events:
        Decide:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /finds/{find_id}/decision
            Method: POST

  # --------------------------------------------------------------------
  # What the owner measured
  # --------------------------------------------------------------------
  # The only writer of find_outcome, which is the only table that can turn an
  # ESTIMATED verdict into a VERIFIED one. Without this route NoOutcomeSource
  # is the only outcome source that exists and the published hit rate is
  # permanently undefined.
  #
  # A separate function from DecisionFunction on purpose, though both are POSTs
  # to /finds/{id}/... behind one session. DecisionFunction may queue Maker
  # tasks; recording a measurement must not be able to spend model calls, and
  # the cheapest way to guarantee that is to not grant the permission.
  OutcomeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: outcome
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.outcome.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Report:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /finds/{find_id}/outcome
            Method: POST

  # --------------------------------------------------------------------
  # Live, read-only owner workflow state for Memory Engine
  # --------------------------------------------------------------------
  WorkflowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: workflow
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.workflow.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Workflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /workflow
            Method: GET

  # --------------------------------------------------------------------
  # Orders — the Quartermaster, live. Standing orders, spend limits, stock
  # and receipts are per-tenant CockroachDB rows; the store stays simulated
  # until DoorDash access lands and the screen says so. Stripe charges are
  # real whenever STRIPE_SECRET_KEY / STRIPE_PAYMENT_METHOD exist in SSM.
  # --------------------------------------------------------------------
  OrdersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: orders
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.orders.handler"]
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        OrdersState:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /orders
            Method: ANY
        OrdersAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /orders/{proxy+}
            Method: ANY

  # --------------------------------------------------------------------
  # Login — unauthenticated by definition, and the way into every tenant
  # --------------------------------------------------------------------
  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: login
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.login.handler"]
      # scrypt at n=16384 is deliberately slow — that is the point — and a cold
      # start pays for the SSM read on top. Ten seconds is generous for one
      # hash; a login that takes longer than this has a different problem.
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        LogIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /login
            Method: POST

  LogoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: logout
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.login.logout_handler"]
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        LogOut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /logout
            Method: POST

  # --------------------------------------------------------------------
  # Signup step one: the account. Gated by the invite code, because this is
  # the endpoint a stranger can reach.
  # --------------------------------------------------------------------
  RegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: register
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.register.handler"]
      Timeout: 15
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /register
            Method: POST

  # --------------------------------------------------------------------
  # Sign in with Google. Three routes, one function:
  #
  #   /auth/google/start     invite checked, then redirect to Google
  #   /auth/google/callback  Google returns; account found or created
  #   /auth/google/complete  the page trades a one-time code for a session
  #
  # The callback never returns a session token — it is a redirect, and a token
  # in a redirect is a token in browser history and in the next request's
  # Referer. It hands over a two-minute one-time code instead, which /complete
  # exchanges over POST.
  #
  # Dormant until /brasstacks/GOOGLE_OAUTH_CLIENT_ID and friends exist: without
  # them every route here answers 404 and the site draws no button.
  # --------------------------------------------------------------------
  OAuthGoogleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: oauth-google
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.oauth_google.handler"]
      # Two network hops on the callback leg: Google's token endpoint, then
      # CockroachDB.
      Timeout: 20
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Start:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /auth/google/start
            Method: GET
        Callback:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /auth/google/callback
            Method: GET
        Complete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /auth/google/complete
            Method: POST

  # --------------------------------------------------------------------
  # Owner-confirmed Google Business Profile execution
  # --------------------------------------------------------------------
  GoogleBusinessTokenKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts tenant Google Business OAuth refresh tokens.
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  GoogleBusinessTokenKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-google-business
      TargetKeyId: !Ref GoogleBusinessTokenKey

  GoogleBusinessFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: google-business
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.google_business.handler"]
      Timeout: 30
      Environment:
        Variables:
          GOOGLE_BUSINESS_TOKEN_KEY_ID: !GetAtt GoogleBusinessTokenKey.Arn
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSsmSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
            - Sid: ProtectGoogleBusinessTokens
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt GoogleBusinessTokenKey.Arn
              Condition:
                StringEquals:
                  "kms:EncryptionContext:provider": google_business
      Events:
        Connect:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /integrations/google-business/connect
            Method: POST
        Callback:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /integrations/google-business/callback
            Method: GET
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /integrations/google-business/status
            Method: GET
        SelectLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /integrations/google-business/select
            Method: POST
        PublishPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /tasks/{task_id}/actions/google-business/publish
            Method: POST

  # --------------------------------------------------------------------
  # Signup step two: the business profile, for an account that already exists
  # --------------------------------------------------------------------
  OnboardingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: onboarding
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.onboarding.handler"]
      # Geocoding plus one embedding call per profile fact, and the menu scan's
      # vision call on top.
      #
      # Held just under the HTTP API's 30s integration timeout, which is the
      # hard ceiling for this API type and cannot be raised. A longer function
      # timeout buys a slow request nothing: API Gateway has already handed the
      # browser a 504, and the only thing the extra seconds do is let the Claude
      # call run to completion, be billed, and have its result discarded — while
      # the owner, looking at an error, retries and pays for it again.
      #
      # Nothing is lost by dying at the ceiling. The scan stores nothing, and
      # signup's write is a single transaction that rolls back, so a killed
      # invocation leaves no half-made tenant behind.
      Timeout: 29
      Policies:
        - Statement:
            # Signup embeds the profile so the Analyst can retrieve it later.
            - Sid: TitanEmbeddings
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Onboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /onboarding
            Method: POST
        # Reads menu photographs during signup. Claude runs on the Anthropic
        # API, not Bedrock, so this needs no extra IAM — the key comes from the
        # SSM parameters this function can already read.
        ScanMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /onboarding/menu-scan
            Method: POST
        ReadProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /profile
            Method: GET
        UpdateProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /profile
            Method: PUT

  # --------------------------------------------------------------------
  # "Show me my first night" — the button at the end of onboarding
  # --------------------------------------------------------------------
  RunFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: run
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.run.handler"]
      # It authorises and fires; it never waits for the night. API Gateway caps
      # an integration at 30s and a night runs 60-90, so a synchronous trigger
      # would 504 while the work carried on invisibly.
      Timeout: 15
      Environment:
        Variables:
          BRASSTACKS_NIGHT_FUNCTION: !Ref NightFunction
      Policies:
        - Statement:
            - Sid: StartOneNight
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt NightFunction.Arn
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Run:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /run
            Method: POST

  # --------------------------------------------------------------------
  # The operator view. The one read that crosses tenant boundaries.
  # --------------------------------------------------------------------
  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: deploy/Dockerfile
      DockerTag: admin
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["brasstacks.handlers.admin.handler"]
      # Reads every active tenant in one set of queries, so it is given more
      # room than the single-tenant workflow endpoint.
      Timeout: 30
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Sid: DecryptSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Workspaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /admin/workspaces
            Method: GET

  AskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      # A public URL proxying a paid model is a bill waiting to happen. This is
      # deliberately low: it is a demo endpoint, not a product surface.
      # (HttpApi uses DefaultRouteSettings; `Throttle` is the REST-API-only
      # property on AWS::Serverless::Api and is silently wrong here.)
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: ["*"]
        # Authorization carries the session token. Without it here the browser
        # drops the header on the preflight and every authenticated call fails
        # in the page while working perfectly in curl.
        AllowHeaders: ["Content-Type", "If-None-Match", "Authorization"]
        AllowMethods: ["GET", "POST", "PUT", "OPTIONS"]
        ExposeHeaders: ["ETag"]

  # --------------------------------------------------------------------
  # The board, hosted
  # --------------------------------------------------------------------
  # A separate bucket from ArtifactBucket, deliberately. That one holds the
  # Maker's owner deliverables; this one is served to the public internet. One
  # bucket for both would be one policy mistake away from publishing her drafts.
  #
  # Unnamed on purpose: S3 bucket names are globally unique, and a hardcoded one
  # makes the template fail for anyone who redeploys it — a judge included.
  # CloudFormation generates a name; SiteBucketName outputs it for the sync.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # The bucket stays private and CloudFront is the only reader. The alternative
  # — an S3 website endpoint — would mean a publicly readable bucket and HTTP
  # only, and the board makes HTTPS calls to the API.
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            # Without this condition any CloudFront distribution in any account
            # could read the bucket.
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # DefaultRootObject only resolves "/" — it does nothing for "/app/" or
  # "/signup/", which are the two pages that matter. With a REST origin S3 has
  # no concept of an index document, so those paths return 403 and the board
  # looks broken while the landing page works. This rewrites them before the
  # request reaches the origin.
  SiteRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-append-index
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory paths to their index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} board
        DefaultRootObject: index.html
        HttpVersion: http2
        # US/Europe only. This is a demo URL, not a global product, and the
        # cheapest class is a third of the price of full coverage.
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteS3Origin
            # RegionalDomainName, not WebsiteURL: the website endpoint would
            # require a public bucket and speaks HTTP only.
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed-CachingOptimized. A fixed AWS-owned id, stable across
          # accounts and regions.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRewriteFunction.FunctionMetadata.FunctionARN

Outputs:
  SiteUrl:
    Description: The board. Landing at /, dashboard at /app/, onboarding at /signup/.
    Value: !Sub https://${SiteDistribution.DomainName}

  SiteBucketName:
    Description: >
      Publish into this after a build:
      aws s3 sync web/ s3://<this>/ --delete
    Value: !Ref SiteBucket

  AskEndpoint:
    # Quoted: the JSON braces contain a colon, which bare YAML reads as a
    # key/value split and rejects.
    Description: 'POST a JSON body {"question": "..."} here. Splice into the built site.'
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/ask

  DecisionEndpoint:
    Description: Base URL used by the static app for Do it / Pass writes.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1

  WorkflowEndpoint:
    Description: GET live owner workflow state for the Memory Engine overlay.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/workflow

  OrdersEndpoint:
    Description: >
      The Quartermaster. GET returns the owner's standing orders, limits,
      stock estimates and receipts; POST /orders/{action} asks, approves,
      rejects, and edits them. Session-scoped like /decision.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/orders

  AdminWorkspacesEndpoint:
    Description: >
      Every active tenant, for an operator. Requires a session whose account
      has is_admin; an ordinary owner's valid session gets a 403.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/admin/workspaces

  RunEndpoint:
    Description: >
      POST with a session token to start that owner's first night. Returns 202
      immediately — the night runs asynchronously and the board polls /workflow.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/run

  OutcomeEndpoint:
    Description: >
      POST {"amount": "210.00", "basis": "day"|"week"|"month", "note": "..."}
      with a session token to record what an accepted move actually earned.
      The Meter judges against it when the measurement window closes — this
      writes a measurement, it does not score one.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/finds/{find_id}/outcome

  RegisterEndpoint:
    Description: >
      Signup step one. POST {"username","password","inviteCode"}; returns a
      session token the onboarding endpoint then requires.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/register

  LoginEndpoint:
    Description: >
      POST {"username": "...", "password": "..."} here. Returns a session token
      to send as `Authorization: Bearer`. POST /logout ends it.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/login

  OnboardingEndpoint:
    Description: >
      Signup. Requires the invite code held at
      /brasstacks/BRASSTACKS_INVITE_CODE — without it every request is a 403.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/onboarding

  ProfileEndpoint:
    Description: Authenticated owner profile read and update endpoint.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/profile

  GoogleStartEndpoint:
    Description: >
      Sign in with Google, leg one. GET ?invite=<code>; redirects to Google.
      Answers 404 until the five /brasstacks/GOOGLE_OAUTH_* parameters exist.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/auth/google/start

  GoogleCallbackEndpoint:
    Description: >
      Paste this exact URL into "Authorized redirect URIs" on the OAuth client
      in the Google Cloud console, and store it at
      /brasstacks/GOOGLE_OAUTH_REDIRECT_URI. Google requires an exact match.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/auth/google/callback

  GoogleCompleteEndpoint:
    Description: >
      Sign in with Google, leg three. POST {"code"} — the one-time code the
      callback put in the redirect fragment — returns a session token.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/auth/google/complete

  GoogleBusinessCallbackEndpoint:
    Description: >
      Add this exact URI to the Google OAuth client and store the same value at
      /brasstacks/GOOGLE_BUSINESS_REDIRECT_URI. Business Profile API access must
      be approved separately by Google.
    Value: !Sub https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/v1/integrations/google-business/callback

  GoogleBusinessTokenKeyArn:
    Description: KMS key used only for tenant Google Business refresh tokens.
    Value: !GetAtt GoogleBusinessTokenKey.Arn

  NightFunctionName:
    Description: Invoke manually to prove a night end to end before the scheduled sweep.
    Value: !Ref NightFunction

  MakerFunctionName:
    Description: Atomic draft worker invoked by the durable Maker workflow.
    Value: !Ref MakerFunction

  MakerWorkflowArn:
    Description: Step Functions Standard workflow for one approved Maker task.
    Value: !Ref MakerWorkflow

  MakerTaskQueueUrl:
    Description: FIFO queue buffering approved work across owner accounts.
    Value: !Ref MakerTaskQueue

  MakerTaskDeadLetterQueueUrl:
    Description: Tasks that exhausted queue delivery attempts.
    Value: !Ref MakerTaskDeadLetterQueue
