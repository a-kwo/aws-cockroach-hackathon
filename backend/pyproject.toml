[project]
name = "brasstacks"
version = "0.1.0"
description = "Agents that find money for small businesses, and prove whether it paid."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Integration tests hit a real CockroachDB cluster. They are NEVER part of
    # the unit suite — a contributor with no cloud account runs `pytest -m "not
    # integration"` and gets a green board.
    "integration: requires a live CockroachDB cluster (deselect with -m 'not integration')",
]
addopts = "-m 'not integration'"
