name: Deploy Brass Tacks

on:
  workflow_dispatch:
    inputs:
      schedule_state:
        description: "Nightly autopilot"
        type: choice
        options: [ENABLED, DISABLED]
        default: ENABLED
      schedule_expression:
        description: "When the night runs, in the stack's ScheduleTimezone"
        type: string
        default: "cron(0 18 * * ? *)"

permissions:
  contents: read

concurrency:
  group: brasstacks-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Confirm AWS account
        run: aws sts get-caller-identity

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          elif [ -f backend/pyproject.toml ]; then
            pip install -e "backend[dev]"
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
            pip install pytest
          else
            pip install pytest
          fi

      - name: Build website for tests
        run: python scripts/build_web.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run CockroachDB schema migration
        env:
          COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
        run: python db/migrate.py --schema-only

      - name: Build Lambda container images
        run: sam build --template deploy/template.yaml

      - name: Read existing deployment parameters
        id: existing
        shell: bash
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks             --stack-name brasstacks             --region us-east-1             --query "Stacks[0].Parameters[?ParameterKey=='ArtifactBucket'].ParameterValue | [0]"             --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ArtifactBucket was not found in the existing stack."
            exit 1
          fi

          echo "artifact_bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "Existing artifact bucket found."

      # ScheduleState and ScheduleExpression are passed on every deploy, and
      # that is the whole point. `sam deploy` reuses the stack's PREVIOUS value
      # for any parameter it is not given, so the template default is only ever
      # read once — at stack creation. The consequence was live: ee58901 moved
      # the nightly run from 06:00 to 18:00 on 2026-08-03 because a 6 AM sweep
      # was reading closed storefronts and the Analyst was publishing finds on
      # the outage, and four successful deploys later the deployed schedule was
      # still cron(0 6 * * ? *). A default nobody sends is a default nobody has.
      #
      # The template keeps DISABLED as its own default, so a fresh clone still
      # deploys a stack that spends nothing until someone asks it to. This
      # workflow is our deployment saying what it wants, visibly, in the Run
      # workflow dialog.
      - name: Deploy existing stack
        id: deploy_stack
        # Values reach the shell through env rather than being interpolated into
        # the script, so a workflow input can never become part of the command.
        env:
          ARTIFACT_BUCKET: ${{ steps.existing.outputs.artifact_bucket }}
          SCHEDULE_STATE: ${{ inputs.schedule_state }}
          SCHEDULE_EXPRESSION: ${{ inputs.schedule_expression }}
        run: |
          # The inner \" are load-bearing. `--parameter-overrides` takes one
          # argument holding every Key=Value pair, and SAM re-splits it on
          # whitespace itself — so the shell's own quotes, which it strips
          # before SAM ever sees them, protect nothing. On 2026-08-07 that sent
          # `ScheduleExpression=cron(0` to CloudFormation, EventBridge rejected
          # it as an invalid schedule expression, and the whole stack update
          # rolled back. SAM's parser does honour literal quotes in the value;
          # these are the ones that survive to it.
          sam deploy             --template-file .aws-sam/build/template.yaml             --stack-name brasstacks             --region us-east-1             --capabilities CAPABILITY_IAM             --resolve-image-repos             --resolve-s3             --no-confirm-changeset             --no-fail-on-empty-changeset             --parameter-overrides "ArtifactBucket=\"$ARTIFACT_BUCKET\" ScheduleState=\"$SCHEDULE_STATE\" ScheduleExpression=\"$SCHEDULE_EXPRESSION\""

      - name: Show CloudFormation failure details
        if: always() && steps.deploy_stack.outcome == 'failure'
        shell: bash
        run: |
          echo "Latest CloudFormation events:"
          aws cloudformation describe-stack-events             --stack-name brasstacks             --region us-east-1             --query "StackEvents[0:50].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]"             --output table

      - name: Read deployed stack outputs
        if: success()
        id: outputs
        shell: bash
        run: |
          STACK=brasstacks
          REGION=us-east-1

          value() {
            aws cloudformation describe-stacks               --stack-name "$STACK"               --region "$REGION"               --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]"               --output text
          }

          echo "decision_endpoint=$(value DecisionEndpoint)" >> "$GITHUB_OUTPUT"
          echo "workflow_endpoint=$(value WorkflowEndpoint)" >> "$GITHUB_OUTPUT"
          echo "site_bucket=$(value SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(value SiteUrl)" >> "$GITHUB_OUTPUT"

          # This job also publishes the site, so it has to build it the same way
          # deploy-frontend.yml does -- it runs later and its upload wins. Every
          # other endpoint survives being left out here, because build_web.py
          # derives them from the decision endpoint; this switch has no fallback,
          # so omitting it silently ships a site with no Sign in with Google
          # button. Same rule, same reason: a button that 404s is worse than none.
          if aws ssm get-parameter \
               --name "/brasstacks/GOOGLE_OAUTH_CLIENT_ID" \
               --region "$REGION" >/dev/null 2>&1; then
            echo "google_oauth_enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "google_oauth_enabled=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate stack outputs
        if: success()
        shell: bash
        run: |
          if [ -z "${{ steps.outputs.outputs.decision_endpoint }}" ] ||              [ "${{ steps.outputs.outputs.decision_endpoint }}" = "None" ]; then
            echo "DecisionEndpoint was not found."
            exit 1
          fi

          if [ -z "${{ steps.outputs.outputs.workflow_endpoint }}" ] ||              [ "${{ steps.outputs.outputs.workflow_endpoint }}" = "None" ]; then
            echo "WorkflowEndpoint was not found."
            exit 1
          fi

          if [ -z "${{ steps.outputs.outputs.site_bucket }}" ] ||              [ "${{ steps.outputs.outputs.site_bucket }}" = "None" ]; then
            echo "SiteBucketName was not found."
            exit 1
          fi

      - name: Build connected frontend
        if: success()
        env:
          DECISION_API_ENDPOINT: ${{ steps.outputs.outputs.decision_endpoint }}
          WORKFLOW_API_ENDPOINT: ${{ steps.outputs.outputs.workflow_endpoint }}
          GOOGLE_OAUTH_ENABLED: ${{ steps.outputs.outputs.google_oauth_enabled }}
        run: python scripts/build_web.py

      - name: Publish frontend to S3
        if: success()
        run: |
          aws s3 sync web/             "s3://${{ steps.outputs.outputs.site_bucket }}/"             --delete

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed."
          echo "Site: ${{ steps.outputs.outputs.site_url }}"
          echo "Workflow: ${{ steps.outputs.outputs.workflow_endpoint }}"
