<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" font-family="Segoe UI, -apple-system, Inter, sans-serif">
  <!-- Brass Tacks — system architecture. Hand-drawn for the hackathon
       submission; the README's Mermaid diagrams carry the same content.
       Palette matches the product: warm near-black, brass, one green. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c9893c"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a6f4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1170" fill="#0c0b09"/>

  <!-- Header -->
  <circle cx="78" cy="64" r="17" fill="#e2a85c"/>
  <circle cx="78" cy="64" r="6.5" fill="#171006"/>
  <text x="108" y="59" fill="#f2efe9" font-size="27" font-weight="800">Brass Tacks — architecture</text>
  <text x="108" y="84" fill="#a39f95" font-size="14.5">An agent team that remembers what it predicted — and checks whether it was right.</text>

  <!-- ============ Owner ============ -->
  <rect x="650" y="128" width="300" height="62" rx="14" fill="#171410" stroke="#3a352c" stroke-width="1.4"/>
  <text x="800" y="155" fill="#f2efe9" font-size="16" font-weight="700" text-anchor="middle">Owner&#8217;s browser</text>
  <text x="800" y="176" fill="#a39f95" font-size="12.5" text-anchor="middle">trybrasstacks.com</text>

  <!-- ============ AWS ============ -->
  <rect x="60" y="280" width="1500" height="420" rx="20" fill="none" stroke="#57503f" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="88" y="316" fill="#d8d4ca" font-size="16.5" font-weight="800">AWS</text>
  <text x="132" y="316" fill="#8f8b83" font-size="13">— runtime &amp; retrieval</text>

  <!-- left column -->
  <rect x="100" y="340" width="300" height="60" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="250" y="365" fill="#f2efe9" font-size="14.5" font-weight="700" text-anchor="middle">CloudFront + S3</text>
  <text x="250" y="384" fill="#a39f95" font-size="12" text-anchor="middle">the static frontend</text>

  <rect x="100" y="428" width="300" height="60" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="250" y="453" fill="#f2efe9" font-size="14.5" font-weight="700" text-anchor="middle">API Gateway</text>
  <text x="250" y="472" fill="#a39f95" font-size="12" text-anchor="middle">every question and decision</text>

  <rect x="100" y="524" width="300" height="116" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="250" y="551" fill="#f2efe9" font-size="14.5" font-weight="700" text-anchor="middle">Request Lambdas</text>
  <text x="250" y="572" fill="#a39f95" font-size="12" text-anchor="middle">ask &#183; decision &#183; orders &#183; workflow</text>
  <text x="250" y="590" fill="#a39f95" font-size="12" text-anchor="middle">auth &#183; onboarding</text>
  <text x="250" y="614" fill="#8a6f4d" font-size="11.5" text-anchor="middle">orders charge Stripe only when an order places</text>

  <!-- middle column -->
  <rect x="452" y="340" width="290" height="60" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="597" y="365" fill="#f2efe9" font-size="14.5" font-weight="700" text-anchor="middle">EventBridge Scheduler</text>
  <text x="597" y="384" fill="#a39f95" font-size="12" text-anchor="middle">the 6 AM wake, every active tenant</text>

  <rect x="452" y="428" width="290" height="60" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="597" y="453" fill="#f2efe9" font-size="13.5" font-weight="700" text-anchor="middle">SQS FIFO &#8594; Step Functions &#8594; SES</text>
  <text x="597" y="472" fill="#a39f95" font-size="12" text-anchor="middle">durable Maker tasks &#183; artifacts to S3</text>

  <rect x="452" y="524" width="290" height="116" rx="12" fill="#1a1510" stroke="#7a5c33" stroke-width="1.5"/>
  <text x="597" y="553" fill="#eec287" font-size="14.5" font-weight="800" text-anchor="middle">Amazon Bedrock</text>
  <text x="597" y="574" fill="#d8d4ca" font-size="12.5" text-anchor="middle">Titan Text Embeddings V2</text>
  <text x="597" y="597" fill="#a39f95" font-size="11.5" text-anchor="middle">generates every vector the index holds —</text>
  <text x="597" y="613" fill="#a39f95" font-size="11.5" text-anchor="middle">no embeddings, no retrieval, no memory</text>

  <!-- the night lambda -->
  <rect x="800" y="332" width="760" height="340" rx="16" fill="#12100c" stroke="#57503f" stroke-width="1.5"/>
  <text x="826" y="362" fill="#d8d4ca" font-size="14.5" font-weight="800">Lambda &#183; night</text>
  <text x="948" y="362" fill="#8f8b83" font-size="12">— one container runs the whole loop</text>

  <rect x="826" y="380" width="350" height="128" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="846" y="408" fill="#e2a85c" font-size="14.5" font-weight="800">1 &#183; RADAR</text>
  <text x="846" y="430" fill="#d8d4ca" font-size="12.5">Observes rivals, reviews and demand</text>
  <text x="846" y="448" fill="#d8d4ca" font-size="12.5">(Tavily web search), embeds every</text>
  <text x="846" y="466" fill="#d8d4ca" font-size="12.5">observation, stores it deduped.</text>

  <rect x="1196" y="380" width="340" height="128" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="1216" y="408" fill="#e2a85c" font-size="14.5" font-weight="800">2 &#183; ANALYST</text>
  <text x="1216" y="430" fill="#d8d4ca" font-size="12.5">Searches ALL accumulated memory,</text>
  <text x="1216" y="448" fill="#d8d4ca" font-size="12.5">reasons with Claude (Anthropic API),</text>
  <text x="1216" y="466" fill="#d8d4ca" font-size="12.5">writes one find + a $/day prediction.</text>

  <rect x="826" y="524" width="350" height="128" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="846" y="552" fill="#e2a85c" font-size="14.5" font-weight="800">3 &#183; MAKER</text>
  <text x="846" y="574" fill="#d8d4ca" font-size="12.5">Builds the approved deliverable;</text>
  <text x="846" y="592" fill="#d8d4ca" font-size="12.5">the artifact lands in S3, review</text>
  <text x="846" y="610" fill="#d8d4ca" font-size="12.5">email goes out through SES.</text>

  <rect x="1196" y="524" width="340" height="128" rx="12" fill="#171410" stroke="#4bb56f" stroke-width="1.5"/>
  <text x="1216" y="552" fill="#4bb56f" font-size="14.5" font-weight="800">4 &#183; METER</text>
  <text x="1216" y="574" fill="#d8d4ca" font-size="12.5">Reads predictions PRIOR nights wrote,</text>
  <text x="1216" y="592" fill="#d8d4ca" font-size="12.5">compares them with what happened:</text>
  <text x="1216" y="610" fill="#d8d4ca" font-size="12.5">VERIFIED / ESTIMATED / MISS.</text>

  <!-- ============ external models & tools ============ -->
  <rect x="820" y="742" width="210" height="70" rx="12" fill="#12100c" stroke="#3a352c" stroke-width="1.3"/>
  <text x="925" y="772" fill="#d8d4ca" font-size="13.5" font-weight="700" text-anchor="middle">Tavily</text>
  <text x="925" y="792" fill="#8f8b83" font-size="11.5" text-anchor="middle">overnight web search</text>

  <rect x="1060" y="742" width="250" height="70" rx="12" fill="#12100c" stroke="#7a5c33" stroke-width="1.4"/>
  <text x="1185" y="772" fill="#eec287" font-size="13.5" font-weight="700" text-anchor="middle">Anthropic API &#183; Claude</text>
  <text x="1185" y="792" fill="#8f8b83" font-size="11.5" text-anchor="middle">all agent reasoning (see Disclosures)</text>

  <rect x="1340" y="742" width="220" height="70" rx="12" fill="#12100c" stroke="#3a352c" stroke-width="1.3"/>
  <text x="1450" y="772" fill="#d8d4ca" font-size="13.5" font-weight="700" text-anchor="middle">Stripe &#183; test mode</text>
  <text x="1450" y="792" fill="#8f8b83" font-size="11.5" text-anchor="middle">real PaymentIntents, test card</text>

  <!-- ============ CockroachDB ============ -->
  <rect x="60" y="880" width="1500" height="250" rx="20" fill="#14110b" stroke="#c9893c" stroke-width="2.2"/>
  <text x="88" y="916" fill="#eec287" font-size="17" font-weight="800">CockroachDB Cloud</text>
  <text x="268" y="916" fill="#a39f95" font-size="13">— the memory layer. Nothing renders that is not a row here.</text>

  <rect x="100" y="940" width="420" height="160" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="120" y="968" fill="#f2efe9" font-size="14" font-weight="800">Managed MCP Server</text>
  <text x="120" y="990" fill="#a39f95" font-size="12.5">Read-only. The Ask agent answers owner</text>
  <text x="120" y="1008" fill="#a39f95" font-size="12.5">questions by querying the live cluster —</text>
  <text x="120" y="1026" fill="#a39f95" font-size="12.5">claims verified against rows, not memory</text>
  <text x="120" y="1044" fill="#a39f95" font-size="12.5">of rows.</text>

  <rect x="560" y="940" width="460" height="160" rx="12" fill="#1a1510" stroke="#7a5c33" stroke-width="1.5"/>
  <text x="580" y="968" fill="#eec287" font-size="14" font-weight="800">Distributed vector index</text>
  <text x="580" y="990" fill="#d8d4ca" font-size="12.5">vector_cosine_ops over every observation.</text>
  <text x="580" y="1008" fill="#a39f95" font-size="12.5">Radar writes it nightly; the Analyst answers</text>
  <text x="580" y="1026" fill="#a39f95" font-size="12.5">concrete hypotheses against ALL of it, and</text>
  <text x="580" y="1044" fill="#a39f95" font-size="12.5">every find records its evidence + similarity.</text>

  <rect x="1060" y="940" width="460" height="160" rx="12" fill="#171410" stroke="#3a352c" stroke-width="1.3"/>
  <text x="1080" y="968" fill="#f2efe9" font-size="14" font-weight="800">Relational memory</text>
  <text x="1080" y="990" fill="#a39f95" font-size="12.5">observations &#183; finds &#183; evidence &#183; predictions &#183;</text>
  <text x="1080" y="1008" fill="#a39f95" font-size="12.5">ledger verdicts &#183; decisions &#183; Maker tasks &#183;</text>
  <text x="1080" y="1026" fill="#a39f95" font-size="12.5">orders &#183; owners &#183; sessions. Money is integer</text>
  <text x="1080" y="1044" fill="#a39f95" font-size="12.5">cents; green means verified only.</text>

  <!-- ============ arrows ============ -->
  <!-- owner -> frontend / api -->
  <path d="M 700 190 C 560 240, 400 270, 280 336" fill="none" stroke="#8a6f4d" stroke-width="1.7" marker-end="url(#arrowSoft)"/>
  <path d="M 760 190 C 660 260, 480 330, 290 424" fill="none" stroke="#8a6f4d" stroke-width="1.7" marker-end="url(#arrowSoft)"/>
  <!-- api -> lambdas -->
  <path d="M 250 488 L 250 520" fill="none" stroke="#8a6f4d" stroke-width="1.7" marker-end="url(#arrowSoft)"/>
  <!-- eventbridge -> night -->
  <path d="M 742 370 L 796 370" fill="none" stroke="#c9893c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- radar -> bedrock -->
  <path d="M 822 470 C 780 510, 760 540, 746 560" fill="none" stroke="#c9893c" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="758" y="505" fill="#b48a55" font-size="11.5" text-anchor="end" stroke="#0c0b09" stroke-width="6" paint-order="stroke">embed each observation</text>
  <!-- bedrock -> vector index -->
  <path d="M 597 644 L 597 762 L 640 936" fill="none" stroke="#c9893c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="585" y="790" fill="#b48a55" font-size="11.5" text-anchor="end" stroke="#0c0b09" stroke-width="6" paint-order="stroke">every vector</text>
  <!-- radar -> vector index (writes) -->
  <path d="M 940 656 C 900 760, 830 860, 750 936" fill="none" stroke="#c9893c" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="800" y="856" fill="#b48a55" font-size="11.5" text-anchor="end" stroke="#0c0b09" stroke-width="6" paint-order="stroke">INSERT observations + vectors, deduped</text>
  <!-- analyst <-> vector index (search) -->
  <path d="M 1250 512 C 1180 700, 1020 860, 880 940" fill="none" stroke="#c9893c" stroke-width="1.9" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1108" y="836" fill="#b48a55" font-size="11.5" stroke="#0c0b09" stroke-width="6" paint-order="stroke">search ALL memory &#8594; evidence + similarity</text>
  <!-- analyst -> anthropic -->
  <path d="M 1186 470 C 1186 560, 1185 640, 1185 738" fill="none" stroke="#8a6f4d" stroke-width="1.7" marker-end="url(#arrowSoft)"/>
  <text x="1196" y="700" fill="#8f8b83" font-size="11.5" stroke="#0c0b09" stroke-width="6" paint-order="stroke">reason over the evidence</text>
  <!-- analyst -> relational (prediction) -->
  <path d="M 1340 656 C 1330 750, 1310 850, 1290 936" fill="none" stroke="#c9893c" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="1318" y="862" fill="#b48a55" font-size="11.5" text-anchor="middle" stroke="#0c0b09" stroke-width="6" paint-order="stroke">write the find + PREDICTION &#8212; &#8220;$/day, verify after&#8221;</text>
  <!-- meter <- relational (reads prior); routed along the right margin so it
       crosses no boxes on the way up to the Meter -->
  <path d="M 1520 936 C 1584 850, 1584 760, 1532 678" fill="none" stroke="#4bb56f" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="1444" y="706" fill="#5fae7c" font-size="11.5" text-anchor="middle" stroke="#0c0b09" stroke-width="6" paint-order="stroke">weeks later: read what</text>
  <text x="1444" y="722" fill="#5fae7c" font-size="11.5" text-anchor="middle" stroke="#0c0b09" stroke-width="6" paint-order="stroke">Night 1 wrote &#8594; verdict</text>
  <!-- radar -> tavily -->
  <path d="M 902 656 C 912 690, 918 710, 922 738" fill="none" stroke="#8a6f4d" stroke-width="1.5" marker-end="url(#arrowSoft)"/>
  <!-- request lambdas -> mcp / relational -->
  <path d="M 250 644 L 250 936" fill="none" stroke="#8a6f4d" stroke-width="1.7" marker-end="url(#arrowSoft)"/>
  <text x="262" y="800" fill="#8f8b83" font-size="11.5" stroke="#0c0b09" stroke-width="6" paint-order="stroke">Ask reads over MCP &#183; decisions &amp; orders are rows</text>
</svg>
