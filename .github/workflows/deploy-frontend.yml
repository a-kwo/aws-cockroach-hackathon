name: Deploy Frontend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_web.py"
      - "scripts/export_fixture.py"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: brasstacks-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: AKIA42QD7G5IVELIB4FM
          aws-secret-access-key: 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
          aws-region: us-east-1

      - name: Read existing stack outputs
        id: outputs
        shell: bash
        run: |
          value() {
            aws cloudformation describe-stacks \
              --stack-name brasstacks \
              --region us-east-1 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          SITE_BUCKET=$(value SiteBucketName)
          SITE_URL=$(value SiteUrl)
          DECISION_ENDPOINT=$(value DecisionEndpoint)
          WORKFLOW_ENDPOINT=$(value WorkflowEndpoint)
          LOGIN_ENDPOINT=$(value LoginEndpoint)
          REGISTER_ENDPOINT=$(value RegisterEndpoint)
          ONBOARDING_ENDPOINT=$(value OnboardingEndpoint)
          RUN_ENDPOINT=$(value RunEndpoint)
          ADMIN_ENDPOINT=$(value AdminWorkspacesEndpoint)

          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${SITE_URL#https://}'].Id | [0]" \
            --output text)

          echo "site_bucket=$SITE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "decision_endpoint=$DECISION_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "workflow_endpoint=$WORKFLOW_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "login_endpoint=$LOGIN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "register_endpoint=$REGISTER_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "onboarding_endpoint=$ONBOARDING_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "run_endpoint=$RUN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "admin_endpoint=$ADMIN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Validate deployment values
        shell: bash
        run: |
          for value in \
            "${{ steps.outputs.outputs.site_bucket }}" \
            "${{ steps.outputs.outputs.site_url }}" \
            "${{ steps.outputs.outputs.distribution_id }}"
          do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "A required stack output was not found."
              exit 1
            fi
          done

      - name: Build connected frontend
        env:
          DECISION_API_ENDPOINT: ${{ steps.outputs.outputs.decision_endpoint }}
          WORKFLOW_API_ENDPOINT: ${{ steps.outputs.outputs.workflow_endpoint }}
          LOGIN_API_ENDPOINT: ${{ steps.outputs.outputs.login_endpoint }}
          REGISTER_API_ENDPOINT: ${{ steps.outputs.outputs.register_endpoint }}
          ONBOARDING_API_ENDPOINT: ${{ steps.outputs.outputs.onboarding_endpoint }}
          RUN_API_ENDPOINT: ${{ steps.outputs.outputs.run_endpoint }}
          ADMIN_API_ENDPOINT: ${{ steps.outputs.outputs.admin_endpoint }}
        run: python scripts/build_web.py

      - name: Upload frontend to S3
        run: |
          aws s3 sync web/ \
            "s3://${{ steps.outputs.outputs.site_bucket }}/" \
            --delete \
            --cache-control "no-cache"

      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Frontend deployed."
          echo "Site: ${{ steps.outputs.outputs.site_url }}"